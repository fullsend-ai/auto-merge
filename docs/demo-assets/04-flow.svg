<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#55e6c1"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g font-family="Inter,DejaVu Sans,sans-serif">
    <text x="100" y="125" fill="#f6fbff" font-size="72" font-weight="800">One request. Six guarded transitions.</text>
    <text x="100" y="185" fill="#93a6bc" font-size="31">Events wake reconciliation; they never bypass a gate.</text>
    <g fill="none" stroke="#55e6c1" stroke-width="6" marker-end="url(#arrow)">
      <path d="M330 440H410"/><path d="M650 440H730"/><path d="M970 440H1050"/><path d="M1290 440H1370"/><path d="M1610 440H1690"/>
    </g>
    <g font-size="27" text-anchor="middle">
      <g transform="translate(90 320)"><rect width="240" height="240" rx="28" fill="#122a3f" stroke="#294762" stroke-width="3"/><circle cx="120" cy="65" r="28" fill="#55e6c1"/><text x="120" y="75" fill="#07111f" font-weight="800">1</text><text x="120" y="132" fill="#f6fbff" font-weight="700">Lifecycle event</text><text x="120" y="175" fill="#93a6bc" font-size="22">PR, review, check,</text><text x="120" y="205" fill="#93a6bc" font-size="22">or human command</text></g>
      <g transform="translate(410 320)"><rect width="240" height="240" rx="28" fill="#122a3f" stroke="#294762" stroke-width="3"/><circle cx="120" cy="65" r="28" fill="#55e6c1"/><text x="120" y="75" fill="#07111f" font-weight="800">2</text><text x="120" y="132" fill="#f6fbff" font-weight="700">Preflight</text><text x="120" y="175" fill="#93a6bc" font-size="22">Exact head, base, CI,</text><text x="120" y="205" fill="#93a6bc" font-size="22">review, DCO, scope</text></g>
      <g transform="translate(730 320)"><rect width="240" height="240" rx="28" fill="#122a3f" stroke="#294762" stroke-width="3"/><circle cx="120" cy="65" r="28" fill="#55e6c1"/><text x="120" y="75" fill="#07111f" font-weight="800">3</text><text x="120" y="132" fill="#f6fbff" font-weight="700">Model judgment</text><text x="120" y="175" fill="#93a6bc" font-size="22">Bounded patch fit,</text><text x="120" y="205" fill="#93a6bc" font-size="22">coherence, risk</text></g>
      <g transform="translate(1050 320)"><rect width="240" height="240" rx="28" fill="#122a3f" stroke="#294762" stroke-width="3"/><circle cx="120" cy="65" r="28" fill="#55e6c1"/><text x="120" y="75" fill="#07111f" font-weight="800">4</text><text x="120" y="132" fill="#f6fbff" font-weight="700">Pending receipt</text><text x="120" y="175" fill="#93a6bc" font-size="22">Write intent before</text><text x="120" y="205" fill="#93a6bc" font-size="22">authority is exercised</text></g>
      <g transform="translate(1370 320)"><rect width="240" height="240" rx="28" fill="#122a3f" stroke="#294762" stroke-width="3"/><circle cx="120" cy="65" r="28" fill="#55e6c1"/><text x="120" y="75" fill="#07111f" font-weight="800">5</text><text x="120" y="132" fill="#f6fbff" font-weight="700">Postflight</text><text x="120" y="175" fill="#93a6bc" font-size="22">Recollect every</text><text x="120" y="205" fill="#93a6bc" font-size="22">mutable forge fact</text></g>
      <g transform="translate(1690 320)"><rect width="140" height="240" rx="28" fill="#55e6c1"/><circle cx="70" cy="65" r="28" fill="#07111f"/><text x="70" y="75" fill="#55e6c1" font-weight="800">6</text><text x="70" y="132" fill="#07111f" font-weight="800">Exact</text><text x="70" y="166" fill="#07111f" font-weight="800">head</text><text x="70" y="200" fill="#07111f" font-weight="800">merge</text></g>
    </g>
    <rect x="100" y="690" width="1720" height="210" rx="28" fill="#0b1827" stroke="#294762" stroke-width="2"/>
    <text x="150" y="760" fill="#55e6c1" font-size="27" font-weight="700" letter-spacing="3">FAIL-CLOSED RULE</text>
    <text x="150" y="825" fill="#f6fbff" font-size="42" font-weight="700">Any stale head, base, review, check, label, thread, or evidence binding</text>
    <text x="150" y="872" fill="#93a6bc" font-size="34">stops the transition. A later event may reconcile again; an old decision never carries forward.</text>
  </g>
</svg>
