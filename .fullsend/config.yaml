# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: claude
roles:
    - coder
    - review
agents:
    - name: code
      source: harness/code-runtime.yaml
    - name: review
      source: harness/review-gemara.yaml
      runtime: claude
    - name: auto-merge
      enabled: false
      source: harness/auto-merge.yaml
      runtime: claude
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai/auto-merge
inference:
    project: it-gcp-konflux-dev-fullsend
    wif_provider: projects/855403973659/locations/global/workloadIdentityPools/fullsend-ai-auto-merge/providers/gh-fullsend-ai-auto-merge

# Experimental local Fullsend build; owner grants and protected queue still apply.
auto_merge:
    mode: shadow
    policy: fullsend-default
    controls:
        - OSPS-QA-03.01
