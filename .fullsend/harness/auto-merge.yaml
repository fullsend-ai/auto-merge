---
# Generated by `fullsend agent new auto-merge`. Edit freely — nothing
# regenerates this file.
#
# `image:` is the container image this agent runs inside, recorded as
# an exact digest so every run uses the same one. Pass --image to
# choose a different one.
#
# This agent handles GitHub only. To add GitLab or Jira, see
# docs/guides/user/bring-your-own-agent.md.
agent: agents/auto-merge.md
description: Decide whether current semantic context permits unattended merge
role: coder
privilege_levels:
  pre_script: read
  runtime: read
  post_script: write
slug: fullsend-ai-auto-merge
image: ghcr.io/fullsend-ai/fullsend-code@sha256:ea2a31f38ee80e2a9a898a898a289fe432aa882fa5a4046c3236ab8e2627d7e7
policy: policies/base.yaml
providers:
  - providers/vertex-ai.yaml
openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
readonly_repo: true
host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
model: opus
effort: high
pre_script: scripts/pre-auto-merge.sh
post_script: scripts/post-auto-merge.sh
validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/auto-merge-result.schema.json
  max_iterations: 2
  preflight_check: python3 -c "import jsonschema"
env:
  runner:
    AUTO_MERGE_SEMANTIC_REVIEWER: "fullsend-ai-review[bot]"
    AUTO_MERGE_RISK_ASSESSMENT_PRODUCER: "fullsend-ai-review[bot]"
    AUTO_MERGE_ALLOWED_REPO: "fullsend-ai/auto-merge"
    AUTO_MERGE_BASE_REF: "main"
    AUTO_MERGE_POLICY_VERSION: "lab-v3-scm-native"
    AUTO_MERGE_MODE: "lab-automatic"
    AUTO_MERGE_ARTIFACT_CORRELATION_MINUTES: "15"
    AUTO_MERGE_MAXIMUM_UNATTENDED_RISK: "moderate"
    AUTO_MERGE_HUMAN_SIGNAL_ASSOCIATIONS: "OWNER,MEMBER,COLLABORATOR"
    AUTO_MERGE_REVIEW_QUALITY_MODE: "off"
    AUTO_MERGE_REVIEW_QUALITY_MINIMUM_SCORE: "0.98"
    AUTO_MERGE_REVIEW_QUALITY_MINIMUM_SAMPLES: "50"
    AUTO_MERGE_CUSTOM_INSTRUCTIONS: "Authorize only when no active trusted-human veto, coordination dependency, sequencing requirement, or unresolved contradiction makes unattended merge inappropriate. Never reinterpret SCM checks or branch policy."
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    ISSUE_URL: ${GITHUB_ISSUE_URL}
    TARGET_REPO_DIR: ${TARGET_REPO_DIR}
  sandbox:
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLAUDE_CODE_USE_VERTEX: "1"
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    FULLSEND_FORGE: github
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    ISSUE_URL: ${GITHUB_ISSUE_URL}
timeout_minutes: 15
trigger: |
  (
    event.transition.kind == "comment_added"
      && event.entity.kind == "work_item"
      && has(event.transition.comment.command)
      && event.transition.comment.command == "/fs-auto-merge"
      && has(event.state.change_proposal)
      && !event.state.change_proposal.is_fork
      && event.actor.kind == "human"
      && event.actor.role in ["admin", "maintain", "write"]
  )
  || (
    event.transition.kind == "comment_added"
      && (event.entity.kind == "change_proposal"
          || (event.entity.kind == "work_item" && has(event.entity.linked_change_proposal)))
      && has(event.state.change_proposal)
      && !event.state.change_proposal.is_fork
      && event.actor.kind == "human"
      && event.actor.role in ["admin", "maintain", "write"]
      && (!has(event.transition.comment.command)
          || event.transition.comment.command == "")
  )
  || (
    event.transition.kind == "review_submitted"
      && (event.entity.kind == "change_proposal"
          || (event.entity.kind == "work_item" && has(event.entity.linked_change_proposal)))
      && has(event.transition.review.state)
      && event.transition.review.state == "approved"
      && has(event.state.change_proposal)
      && !event.state.change_proposal.is_fork
      && (
        event.actor.id == "fullsend-ai-review[bot]"
        || (event.actor.kind == "human"
            && event.actor.role in ["admin", "maintain", "write"])
      )
  )
