---
# Generated by `fullsend agent new auto-merge`. Edit freely — nothing
# regenerates this file.
#
# `image:` is the container image this agent runs inside, recorded as
# an exact digest so every run uses the same one. Pass --image to
# choose a different one.
#
# This agent handles GitHub only. To add GitLab or Jira, see
# docs/guides/user/bring-your-own-agent.md.
agent: agents/auto-merge.md
description: Safely merge eligible pull requests after deterministic and semantic approval
role: coder
slug: ascerra-auto-merge
image: ghcr.io/fullsend-ai/fullsend-code@sha256:ea2a31f38ee80e2a9a898a898a289fe432aa882fa5a4046c3236ab8e2627d7e7
policy: policies/base.yaml
providers:
  - providers/vertex-ai.yaml
openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
readonly_repo: true
host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
model: opus
effort: high
pre_script: scripts/pre-auto-merge.sh
post_script: scripts/post-auto-merge.sh
validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/auto-merge-result.schema.json
  max_iterations: 2
  preflight_check: python3 -c "import jsonschema"
env:
  runner:
    AUTO_MERGE_ALLOWED_AUTHORS: "fullsend-ai-coder[bot],fullsend-ai[bot]"
    AUTO_MERGE_ALLOWED_PATHS: "docs/example-feature.md"
    AUTO_MERGE_ALLOWED_REPO: "ascerra/auto-merge"
    AUTO_MERGE_BASE_REF: "main"
    AUTO_MERGE_POLICY_VERSION: "lab-v1"
    AUTO_MERGE_REQUIRED_CHECKS: "Example contract,Delayed integration (4 minutes)"
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    ISSUE_URL: ${GITHUB_ISSUE_URL}
    TARGET_REPO_DIR: ${TARGET_REPO_DIR}
  sandbox:
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLAUDE_CODE_USE_VERTEX: "1"
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    FULLSEND_FORGE: github
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    ISSUE_URL: ${GITHUB_ISSUE_URL}
timeout_minutes: 15
trigger: |
  event.transition.kind == "comment_added"
    && event.entity.kind == "work_item"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-auto-merge"
    && (!has(event.state.change_proposal) || !event.state.change_proposal.is_fork)
