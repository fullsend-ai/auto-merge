name: Gemara merge queue validation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read
jobs:
  shared:
    if: github.event_name == 'merge_group' && github.repository == 'fullsend-ai/auto-merge'
    uses: ./.github/workflows/gemara-shared-gate.yml
    with:
      source: ${{ github.event.merge_group.base_sha }}
      phase: queue
      group: ${{ github.event.merge_group.head_sha }}
      group_ref: ${{ github.event.merge_group.head_ref }}
  gate:
    name: Gemara pilot queue gate
    needs: shared
    if: always() && github.repository == 'fullsend-ai/auto-merge'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Refuse a missing or held shared queue assessment
        if: github.event_name == 'merge_group'
        env:
          SHARED_RESULT: ${{ needs.shared.result }}
          SHARED_ELIGIBLE: ${{ needs.shared.outputs.eligible }}
        run: test "$SHARED_RESULT" = success && test "$SHARED_ELIGIBLE" = true
      - name: Defer final queue validation until the merge group exists
        if: github.event_name == 'pull_request'
        run: echo 'Pre-queue only. The required merge-group check performs final native authorization.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'merge_group'
        with:
          # Platform-provided trusted main base, never the PR or synthetic checkout.
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: github.event_name == 'merge_group'
        with:
          go-version: '1.26.6'
          cache: false
      - name: Prepare native evaluator without forge credentials
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          python3 gemara-auto-merge/install_pinned_toolchain.py
          python3 gemara-auto-merge/build_native_evaluator.py
      - name: Authorize the actual cumulative queue tree with native Gemara
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_SOURCE_SHA: ${{ github.event.merge_group.base_sha }}
          PILOT_EVENT_NAME: ${{ github.event_name }}
          PILOT_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          PILOT_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PILOT_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: python3 gemara-auto-merge/authorize_auto_merge.py --phase queue
      - name: Retain normalized Gemara evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gemara-evaluation-${{ github.job }}-${{ github.run_attempt }}
          path: gemara-auto-merge/out/bundle-*/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: false
