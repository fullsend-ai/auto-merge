name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  example-contract:
    name: Example contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate example document
        run: python3 scripts/validate_example.py

  delayed-integration:
    name: Delayed integration (4 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulate a longer integration check
        run: sleep 240
      - name: Validate example document after the delay
        run: python3 scripts/validate_example.py

  queue-authorization:
    name: Auto-Merge queue authorization
    if: ${{ github.event_name == 'merge_group' }}
    needs: [example-contract, delayed-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
      - name: Revalidate Fullsend semantic authorization
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE_ALLOWED_REPOSITORY: fullsend-ai/auto-merge
          AUTO_MERGE_BASE_REF: main
          AUTO_MERGE_POLICY_VERSION: lab-v3-scm-native
          AUTO_MERGE_MODE: lab-automatic
          AUTO_MERGE_SEMANTIC_REVIEWER: fullsend-ai-review[bot]
          AUTO_MERGE_RISK_ASSESSMENT_PRODUCER: fullsend-ai-review[bot]
          AUTO_MERGE_ARTIFACT_CORRELATION_MINUTES: "15"
          AUTO_MERGE_MAXIMUM_UNATTENDED_RISK: moderate
          AUTO_MERGE_HUMAN_SIGNAL_ASSOCIATIONS: OWNER,MEMBER,COLLABORATOR
          AUTO_MERGE_REVIEW_QUALITY_MODE: "off"
          AUTO_MERGE_REVIEW_QUALITY_MINIMUM_SCORE: "0.98"
          AUTO_MERGE_REVIEW_QUALITY_MINIMUM_SAMPLES: "50"
          AUTO_MERGE_CUSTOM_INSTRUCTIONS: >-
            Do not authorize when trusted human context contains an unresolved
            request to pause, sequencing requirement, or required follow-up.
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 .fullsend/scripts/auto_merge_queue_gate.py
