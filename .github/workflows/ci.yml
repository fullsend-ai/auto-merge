name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  example-contract:
    name: Example contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate example document
        run: python3 scripts/validate_example.py

  delayed-integration:
    name: Delayed integration (4 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulate a longer integration check
        run: sleep 240
      - name: Validate example document after the delay
        run: python3 scripts/validate_example.py

  merge-group-proof:
    name: Merge group proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove the evaluated ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha || '' }}
        run: |
          set -euo pipefail
          test -n "${SHA}"
          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            test -n "${MERGE_GROUP_SHA}"
            echo "merge-group proof: synthetic ref=${REF_NAME} head_sha=${MERGE_GROUP_SHA}"
          else
            echo "merge-group proof: pre-queue pull_request ref=${REF_NAME} head_sha=${SHA}"
          fi
