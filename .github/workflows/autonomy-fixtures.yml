name: Experimental autonomy fixtures

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    name: Policy adapter fixture tests (no merge authority)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
          cache: false
      - name: Install checksum-pinned schema validator
        run: python3 experiments/gemara-spike/bootstrap_cue.py
      - name: Build pinned SDK and verify its native behavior
        run: python3 experiments/autonomy-platform/build_sdk.py
      - name: Test adapters and bounded observation handling
        run: python3 -m unittest discover -s experiments/autonomy-platform -p 'test_*.py'
      - name: Exercise four modes using synthetic inputs only
        run: python3 experiments/autonomy-platform/demo.py
